services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:80"

  mongodb:
    image: mongo:8.2
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
    env_file: .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set marketplace http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing marketplace/marketplace-private;
      mc anonymous set none marketplace/marketplace-private;
      "

volumes:
  mongo-data:
  minio-data:
